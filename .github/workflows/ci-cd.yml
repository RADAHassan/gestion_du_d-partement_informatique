name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ Lint
  lint:
    name: Lint (backend, frontend, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            tests/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm ci
        working-directory: tests
      - run: npm run lint
        working-directory: tests

  # ----------------------------------------------------------------- Tests
  test:
    name: Tests (unitaires, intégration, sécurité)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dept_info_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dept_info_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: tests
      - name: Tests unitaires
        run: npm run test:unit
        working-directory: tests
      - name: Tests d'intégration
        run: npm run test:integration
        working-directory: tests
      - name: Tests de sécurité (RBAC, injections SQL, XSS, CSRF)
        run: npm run test:security
        working-directory: tests

  # ------------------------------------------------------- Build frontend
  build-frontend:
    name: Build du frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ------------------------------------------- Vérification des images Docker
  docker:
    name: Build des images Docker + test de fumée
    runs-on: ubuntu-latest
    needs: [lint, test, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Préparer .env (secrets éphémères)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
      - name: Valider docker-compose.yml
        run: docker compose config -q
      - name: Construire les images
        run: docker compose build
      - name: Démarrer la stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Test de fumée (santé + connexion via nginx)
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8080' \
            -d '{"email":"admin@fsttanger.ma","password":"Admin@1234"}' | grep -q '"token"'
      - name: Tester la sauvegarde
        run: |
          bash scripts/backup_db.sh
          ls -l backups/*.sql.gz
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  # ------------------------------------------- Déploiement continu (images)
  publish:
    name: Publier les images (GHCR)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
